name: Vaktija Kassel automatisch aktualisieren

on:
  schedule:
    # Läuft täglich um 01:15 UTC (= 02:15/03:15 deutsche Zeit, je nach Sommer/Winterzeit)
    - cron: "15 1 * * *"
  workflow_dispatch: {}   # Erlaubt manuellen Start über den "Run workflow"-Button auf GitHub

permissions:
  contents: write   # Damit der Workflow die CSV-Datei ins Repo zurückschreiben (committen) darf

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Gebetszeiten abrufen und CSV aktualisieren
        run: python update_vaktija.py

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "vaktija-bot"
          git config user.email "actions@github.com"
          git add Gebetszeiten.csv
          git diff --staged --quiet || git commit -m "Automatisches Update der Gebetszeiten Kassel"
          git push
